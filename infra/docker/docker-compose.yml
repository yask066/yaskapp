name: yaskapp

services:
  postgres:
    image: postgres:16-alpine
    container_name: yaskapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yaskapp
      POSTGRES_USER: yaskapp
      POSTGRES_PASSWORD: yaskapp
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7-alpine
    container_name: yaskapp-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: yaskapp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: yaskapp
      MINIO_ROOT_PASSWORD: yaskapp-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  postgres-data:
  minio-data:
