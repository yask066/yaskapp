name: yaskapp-staging

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # The base staging stack can run without cloud credentials while deletion is disabled.
  # Include this overlay only after the independent journal and checkpoint are configured.
  api:
    env_file:
      - ../../services/api/.env.account-deletion-cloud.staging

  account-deletion-worker:
    image: yaskapp-api:staging
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file:
      - ../../services/api/.env.staging
      - ../../services/api/.env.account-deletion-cloud.staging
      - ../../services/api/.env.account-deletion-retention.staging
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["node", "services/api/dist/jobs/run-account-deletion-worker.js"]
    restart: unless-stopped

  account-deletion-journal-exporter:
    image: yaskapp-api:staging
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    env_file:
      - ../../services/api/.env.staging
      - ../../services/api/.env.account-deletion-cloud.staging
      - ../../services/api/.env.account-deletion-retention.staging
    logging: *default-logging
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - >-
        while true; do
          if node services/api/dist/jobs/export-account-deletion-journal.js; then
            echo '{"event":"account_deletion.journal_exporter.complete"}';
          else
            echo '{"event":"account_deletion.alert","component":"journal_exporter","error":"export_failed"}';
          fi;
          sleep 300;
        done
    restart: unless-stopped

  backup-uploader:
    image: yaskapp-api:staging
    build:
      context: ../..
      dockerfile: services/api/Dockerfile
    profiles: ["maintenance"]
    env_file:
      - ../../services/api/.env.staging
      - ../../services/api/.env.account-deletion-cloud.staging
    logging: *default-logging
    entrypoint: ["node", "services/api/dist/jobs/upload-staging-backup.js"]
    restart: "no"
