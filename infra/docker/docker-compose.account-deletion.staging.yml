# Compatibility overlay. The base staging stack runs the cleanup worker and
# stores deletion operations in the application PostgreSQL database.
name: yaskapp-staging

services:
  api:
    environment:
      ACCOUNT_DELETION_ENABLED: "true"
      ACCOUNT_DELETION_JOURNAL_ENABLED: "false"

  account-deletion-worker:
    environment:
      ACCOUNT_DELETION_JOURNAL_ENABLED: "false"
