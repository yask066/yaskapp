name: Release readiness
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_run:
    workflows: [Staging]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  check:
    if: vars.STAGING_DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_run' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node infra/release/github.mjs check
