name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Public web checks
        run: |
          npm run shared:build
          npm run typecheck -w @yaskapp/web
          npm run lint -w @yaskapp/web
          npm run test -w @yaskapp/web -- --run
          npm run build -w @yaskapp/web
          node --test infra/docker/test/*.test.mjs apps/web/test/smoke.test.mjs
      - name: Moderation web syntax and smoke tests
        working-directory: apps/moderation-web
        run: |
          node --check src/main.js
          node --test test/smoke.test.mjs

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: yaskapp
          POSTGRES_USER: yaskapp
          POSTGRES_PASSWORD: yaskapp
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U yaskapp -d yaskapp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://yaskapp:yaskapp@localhost:5432/yaskapp
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret-with-at-least-16-chars
      S3_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_BUCKET: yaskapp-media
      S3_ACCESS_KEY_ID: yaskapp
      S3_SECRET_ACCESS_KEY: yaskapp-secret
      S3_FORCE_PATH_STYLE: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start MinIO and create test bucket
        working-directory: services/api
        run: |
          docker run -d --name ci-minio -p 9000:9000 \
            -e MINIO_ROOT_USER=yaskapp \
            -e MINIO_ROOT_PASSWORD=yaskapp-secret \
            cgr.dev/chainguard/minio:latest server /data
          curl --fail --silent --show-error --max-time 2 --retry 30 --retry-all-errors \
            --retry-delay 2 --retry-max-time 65 http://127.0.0.1:9000/minio/health/live
          node --input-type=module -e "
            import { S3Client, CreateBucketCommand } from '@aws-sdk/client-s3';
            const s3 = new S3Client({
              endpoint: process.env.S3_ENDPOINT,
              region: process.env.S3_REGION,
              forcePathStyle: true,
              credentials: {
                accessKeyId: process.env.S3_ACCESS_KEY_ID,
                secretAccessKey: process.env.S3_SECRET_ACCESS_KEY,
              },
            });
            try {
              await s3.send(new CreateBucketCommand({ Bucket: process.env.S3_BUCKET }));
            } catch (error) {
              if (error?.name !== 'BucketAlreadyOwnedByYou' && error?.name !== 'BucketAlreadyExists') throw error;
            }
          "
      - run: npm run api:typecheck
      - run: npm run api:test
      - name: Create push worker test database
        env:
          PGPASSWORD: yaskapp
        run: createdb --host=127.0.0.1 --username=yaskapp yaskapp_push_worker
      - name: Push worker integration tests
        working-directory: services/api
        env:
          DATABASE_URL: postgres://yaskapp:yaskapp@localhost:5432/yaskapp_push_worker
          NOTIFICATION_WORKER_TEST_DATABASE_URL: postgres://yaskapp:yaskapp@localhost:5432/yaskapp_push_worker
        run: |
          npm run db:migrate
          node --import tsx --test src/jobs/notification-push-worker.integration.test.ts
      - name: Create poll feed snapshot test database
        env:
          PGPASSWORD: yaskapp
        run: createdb --host=127.0.0.1 --username=yaskapp yaskapp_pagination
      - name: Poll feed snapshot lifecycle integration tests
        working-directory: services/api
        env:
          DATABASE_URL: postgres://yaskapp:yaskapp@localhost:5432/yaskapp_pagination
          PAGINATION_TEST_DATABASE_URL: postgres://yaskapp:yaskapp@localhost:5432/yaskapp_pagination
        run: |
          npm run db:migrate
          node --import tsx --test src/modules/polls/poll-feed-snapshots.test.ts

  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: python3 -m unittest discover -s infra/release -p 'test_*.py'
      - run: node --test infra/release/*.test.mjs
      - name: Validate isolated Compose configuration
        run: |
          cp services/api/.env.staging.example services/api/.env.staging
          docker compose -f infra/docker/docker-compose.staging.yml -f infra/release/compose.test.yml config --quiet

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build separate Android test application
        env:
          ORG_GRADLE_PROJECT_yaskappTestBuild: 'true'
        run: >-
          flutter build apk --debug
          --dart-define=API_BASE_URL=https://api-test.yaskapp.org
          --dart-define=API_WEBSOCKET_URL=wss://api-test.yaskapp.org/realtime
          --dart-define=YASKAPP_PUSH_ENABLED=false
      - uses: actions/upload-artifact@v4
        with:
          name: android-test-${{ github.sha }}
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
