<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yaskapp Moderation</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main id="app" class="shell">
      <section id="login-view" class="card auth-card">
        <p class="eyebrow">YASKAPP TRUST & SAFETY</p>
        <h1>Moderation workspace</h1>
        <p class="muted">This workspace is restricted to authorized moderation staff.</p>
        <form id="login-form">
          <label>Login<input name="login" required autocomplete="username" /></label>
          <label>Password<input name="password" type="password" required autocomplete="current-password" /></label>
          <button class="primary" type="submit">Sign in</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="panel-view" hidden>
        <header class="topbar">
          <div><p class="eyebrow">YASKAPP TRUST & SAFETY</p><h1>Moderation queue</h1></div>
          <button id="logout-button" class="ghost">Sign out</button>
        </header>
        <div id="capability-error" class="error" role="alert"></div>
        <nav class="panel-nav card" aria-label="Moderation sections">
          <button class="nav-tab active" data-section="cases">Cases</button>
          <button class="nav-tab" data-section="appeals" data-permission="moderation.appeal.read" hidden>Appeals</button>
          <button class="nav-tab" data-section="audit" data-permission="admin.audit.read" hidden>Audit</button>
          <button class="nav-tab" data-section="policy" data-permission="moderation.policy.read" hidden>Policy</button>
        </nav>
        <div id="section-cases" class="panel-section">
        <section class="toolbar card">
          <label>Status<select id="status-filter"><option value="">All</option><option value="open">Open</option><option value="in_review">In review</option><option value="escalated">Escalated</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select></label>
          <label>Priority<select id="priority-filter"><option value="">All</option><option value="critical">Critical</option><option value="high">High</option><option value="normal">Normal</option><option value="low">Low</option></select></label>
          <button id="refresh-button" class="secondary">Refresh</button>
        </section>
        <div class="workspace">
          <section class="card queue-card"><div class="section-title"><h2>Cases</h2><span id="case-count" class="muted"></span></div><div id="queue" class="queue"></div><button id="load-more" class="secondary" hidden>Load more</button></section>
          <section id="case-detail" class="card detail-card"><div class="empty">Select a case to inspect it.</div></section>
        </div>
        </div>
        <div id="section-appeals" class="panel-section" hidden>
          <section id="appeals-card" class="card appeals-card"><div class="section-title"><h2>Appeals</h2><button id="refresh-appeals" class="secondary">Refresh</button></div><div id="appeals" class="queue"></div><button id="appeals-load-more" class="secondary" hidden>Load more</button></section>
        </div>
        <div id="section-audit" class="panel-section" hidden>
          <section class="card appeals-card"><div class="section-title"><h2>Audit</h2><button id="refresh-audit" class="secondary">Refresh</button></div><div id="audit" class="queue"></div><button id="audit-load-more" class="secondary" hidden>Load more</button></section>
        </div>
        <div id="section-policy" class="panel-section" hidden>
          <section class="card appeals-card"><div class="section-title"><h2>Policy settings</h2><button id="refresh-policy" class="secondary">Refresh</button></div><form id="policy-form" class="policy-form"><label>Posting restriction strikes<input name="postingRestrictionStrikes" type="number" min="1" max="100" required></label><label>Temporary ban strikes<input name="temporaryBanStrikes" type="number" min="1" max="100" required></label><label>Strike retention days<input name="strikeRetentionDays" type="number" min="1" max="3650" required></label><label>Default restriction hours<input name="defaultRestrictionHours" type="number" min="1" max="8760" required></label><label>Default temporary ban hours<input name="defaultTemporaryBanHours" type="number" min="1" max="8760" required></label><label>Reason<textarea name="reason" required minlength="1" maxlength="500"></textarea></label><button class="primary" type="submit">Save policy</button><p id="policy-status" class="muted"></p></form></section>
        </div>
      </section>
    </main>
    <script>window.__MODERATION_API_BASE__ = window.__MODERATION_API_BASE__ || '';</script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
